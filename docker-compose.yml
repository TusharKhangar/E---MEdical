# Full stack in two containers: the app (API + React UI) and MySQL.
#
#   docker compose up --build
#   open http://localhost:8080
#
# Sign in with ADMIN_EMAIL / ADMIN_PASSWORD from your .env (the first administrator is created on first start).
# E-mail is optional: without BREVO_API_KEY or MAIL_USERNAME/MAIL_PASSWORD, links are printed in the app logs.
#
# Metrics too: docker compose --profile observability up --build
#   Grafana    http://localhost:3000  (admin / admin), dashboard "E-Medical"
#   Prometheus http://localhost:9090

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: userauth
      MYSQL_USER: emedical
      MYSQL_PASSWORD: emedical
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uemedical", "-pemedical"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/userauth
      DB_USERNAME: emedical
      DB_PASSWORD: emedical
      JWT_SECRET: ${JWT_SECRET:-Zm9yLWxvY2FsLWRvY2tlci1vbmx5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uIQ==}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      METRICS_TOKEN: local-metrics-token
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
