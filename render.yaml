# Render blueprint: one web service built from the Dockerfile plus a managed PostgreSQL database.
# In the Render dashboard: New > Blueprint > pick this repository. Everything below is created for you.
# Values marked "sync: false" are secrets you type into the Render dashboard (Environment tab):
#   BREVO_API_KEY + MAIL_FROM  e-mail (Render's free plan blocks SMTP, so Gmail SMTP can't be used here)
#   ADMIN_EMAIL + ADMIN_PASSWORD  the first administrator, created on startup if that e-mail is new
services:
  - type: web
    name: e-medical
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_VENDOR
        value: postgresql
      - key: DB_HOST
        fromDatabase:
          name: e-medical-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: e-medical-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: e-medical-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: e-medical-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: e-medical-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://e-medical-224w.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://e-medical-224w.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_TIME_ZONE
        value: Asia/Kolkata
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75 -Xss512k

databases:
  - name: e-medical-db
    plan: free
    databaseName: emedical
    user: emedical
