name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and package
        working-directory: bioMedical
        run: mvn -B package

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/medical-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/medical-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/medical-frontend/package-lock.json
      - name: Build the app with the UI inside
        run: |
          cd Frontend/medical-frontend && npm ci --no-audit --no-fund && npm run build && cd -
          cp -r Frontend/medical-frontend/dist bioMedical/src/main/resources/static
          cd bioMedical && mvn -B -q -DskipTests package
      - name: Install Chromium
        working-directory: Frontend/medical-frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: Frontend/medical-frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Frontend/medical-frontend/e2e/.report
            Frontend/medical-frontend/e2e/.results
            Frontend/medical-frontend/e2e/.app.log
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t e-medical:ci .
