# Tests run on an in-memory H2 database and never read a local .env file.
spring.config.import=
# A separate in-memory database per Spring context, so one test class closing its context (and dropping
# its tables) never affects another cached context
spring.datasource.url=jdbc:h2:mem:emedical-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,DATE,TIME,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# No SMTP account: EmailService logs messages instead of sending them
spring.mail.host=localhost
spring.mail.username=

# Test-only signing key (JwtUtil uses the raw bytes; at least 32 characters)
jwt.secret=test-only-jwt-signing-key-not-a-real-secret-0123456789
jwt.expiration=3600000

app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
spring.devtools.livereload.enabled=false
