# Tests run on an in-memory H2 database and never read a local .env file.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:emedical-test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,DATE,TIME,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# No SMTP account: EmailService logs messages instead of sending them
spring.mail.username=

jwt.secret=dGVzdC1zZWNyZXQtZm9yLWp3dC1zaWduaW5nLW11c3QtYmUtbG9uZy1lbm91Z2g=
jwt.expiration=3600000

app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
spring.devtools.livereload.enabled=false
