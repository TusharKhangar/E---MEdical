# ===============================
# SECRETS
# ===============================
# Secret values come from environment variables. For local runs, put them in a .env file at the
# repository root (or in bioMedical/) - see .env.example. The .env file is git-ignored.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===============================
# TOMCAT
# ===============================
server.port=${PORT:8080}
#server.address=127.0.0.1
#server.error.whitelabel.enabled=false
#server.tomcat.accesslog.enabled=true

# ===============================
# SMTP EMAIL
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Base URL of the React app, used in links inside e-mails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Comma-separated browser origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===============================
# = LOGGING
# ===============================
#logging.level.org.springframework.web=DEBUG
#logging.level.org.hibernate=DEBUG
#logging.level.org.springframework.security=DEBUG

# ===============================
# = DATA SOURCE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/userauth}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#json web token secret (Base64, at least 256 bits; generate one with: openssl rand -base64 32)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# = ACTUATOR
# ===============================
# Only health and info are public; details such as DB status are shown to signed-in admins.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.health.mail.enabled=false

#Live-reload in case of change in the code
spring.devtools.livereload.enabled=true
